<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Backend 配置</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b21; --border: #262a33; --text: #e6e8ec;
    --muted: #9aa1ad; --primary: #6366f1; --danger: #ef4444; --ok: #10b981; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.desc { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  input[type=password], input[type=text] { width: 100%; padding: 9px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; }
  button { padding: 9px 16px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .row { display: flex; gap: 8px; align-items: center; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .badge.active { background: rgba(16,185,129,.15); color: var(--ok); }
  .badge.revoked { background: rgba(239,68,68,.15); color: var(--danger); }
  .badge.queued, .badge.retrying { background: rgba(245,158,11,.15); color: var(--warn); }
  .badge.running { background: rgba(99,102,241,.15); color: var(--primary); }
  .badge.succeeded, .badge.idle { background: rgba(16,185,129,.15); color: var(--ok); }
  .badge.failed, .badge.busy { background: rgba(239,68,68,.15); color: var(--danger); }
  .badge.canceled { background: rgba(154,161,173,.2); color: var(--muted); }
  .clip { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); }
  .hidden { display: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OpenCode Backend</h1>
  <p class="desc">无头服务的配置面板。管理登录密码与 APP 访问 Token。</p>

  <div id="loginCard" class="card">
    <h2>登录</h2>
    <label for="pw">管理密码</label>
    <input type="password" id="pw" placeholder="默认密码见安装时提示，可在下方修改">
    <div class="row" style="margin-top:12px">
      <button onclick="doLogin()">登录</button>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="adminCard" class="card hidden">
    <h2>系统状态</h2>
    <div id="sysInfo" class="muted">加载中…</div>

    <h2 style="margin-top:20px">修改管理密码</h2>
    <label for="newpw">新密码</label>
    <input type="password" id="newpw" placeholder="至少 4 位">
    <div class="row" style="margin-top:12px">
      <button onclick="doChangePassword()">保存密码</button>
    </div>
    <div id="pwMsg" class="msg"></div>

    <h2 style="margin-top:20px">APP Token</h2>
    <div class="row">
      <input type="text" id="tokenName" placeholder="设备名，如 我的手机" style="flex:1">
      <button onclick="doCreateToken()">生成 Token</button>
    </div>
    <div id="tokenMsg" class="msg"></div>
    <div id="newTokenBox" class="hidden">
      <label>新 Token（仅显示一次，请立即保存）</label>
      <input type="text" id="newToken" class="mono" readonly>
    </div>
    <table id="tokenTable">
      <thead><tr><th>名称</th><th>ID</th><th>创建时间</th><th>状态</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>任务列表</h2>
    <div class="row">
      <input type="text" id="appToken" class="mono" placeholder="APP Token（用于访问任务 / 项目接口）" style="flex:1">
      <button onclick="loadTasks()">加载任务</button>
      <button class="ghost" onclick="loadProjects()">加载项目</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">Token 仅保存在浏览器本地（localStorage），不会上传到服务器。</div>
    <div id="taskMsg" class="msg"></div>
    <table id="taskTable">
      <thead><tr><th>ID</th><th>目录</th><th>Prompt</th><th>状态</th><th>进度</th><th>结果 / 错误</th><th>创建时间</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>编排项目</h2>
    <div class="row">
      <button onclick="loadProjects()">加载项目</button>
    </div>
    <div id="projectMsg" class="msg"></div>
    <table id="projectTable">
      <thead><tr><th>会话 ID</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const SESSION_KEY = "ocb_web_session";
let session = localStorage.getItem(SESSION_KEY) || "";

function hdr(extra) {
  const h = { "Content-Type": "application/json" };
  if (session) h["X-Web-Session"] = session;
  return Object.assign(h, extra || {});
}
function show(el, msg, ok) {
  el.textContent = msg || "";
  el.className = "msg " + (ok ? "ok" : "err");
}

// 统一的 fetch 封装：任何接口返回 401 都视为会话过期，自动回登录页。
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401 && session) {
    session = "";
    localStorage.removeItem(SESSION_KEY);
    show(document.getElementById("loginMsg"), "会话已过期，请重新登录");
    loadAdmin();
    throw new Error("unauthorized");
  }
  return res;
}

async function doLogin() {
  const pw = document.getElementById("pw").value;
  const res = await fetch("/api/web/session", { method: "POST", headers: hdr(), body: JSON.stringify({ password: pw }) });
  const data = await res.json();
  if (!res.ok) { show(document.getElementById("loginMsg"), data.error || "登录失败"); return; }
  session = data.session;
  localStorage.setItem(SESSION_KEY, session);
  show(document.getElementById("loginMsg"), "已登录", true);
  loadAdmin();
}

async function loadAdmin() {
  const login = document.getElementById("loginCard");
  const admin = document.getElementById("adminCard");
  if (!session) { login.classList.remove("hidden"); admin.classList.add("hidden"); return; }
  login.classList.add("hidden");
  admin.classList.remove("hidden");
  let res;
  try {
    res = await api("/api/system", { headers: hdr() });
  } catch (_) { return; }
  const sys = await res.json();
  document.getElementById("sysInfo").textContent =
    `后端 opencode-backend · 上游 ${sys.opencodeURL} · 版本 ${sys.opencodeVersion || "未知"} · 数据库 ${sys.db}`;
  const saved = localStorage.getItem(APP_TOKEN_KEY) || "";
  const tokenInput = document.getElementById("appToken");
  if (tokenInput) tokenInput.value = saved;
  if (saved) { loadTasks(); loadProjects(); }
  loadTokens();
}

async function doChangePassword() {
  const np = document.getElementById("newpw").value;
  const res = await api("/api/web/password", { method: "POST", headers: hdr(), body: JSON.stringify({ newPassword: np }) });
  const data = await res.json();
  show(document.getElementById("pwMsg"), res.ok ? "密码已更新" : (data.error || "修改失败"), res.ok);
}

async function loadTokens() {
  const res = await api("/api/tokens", { headers: hdr() });
  if (!res.ok) return;
  const tokens = await res.json();
  const tb = document.querySelector("#tokenTable tbody");
  tb.innerHTML = "";
  for (const t of tokens) {
    const tr = document.createElement("tr");
    const active = !t.revokedAt;
    tr.innerHTML = `
      <td>${escapeHtml(t.name || "(未命名)")}</td>
      <td class="mono">${escapeHtml(t.id)}</td>
      <td>${new Date(t.createdAt).toLocaleString()}</td>
      <td><span class="badge ${active ? "active" : "revoked"}">${active ? "启用" : "已撤销"}</span></td>
      <td>${active ? `<button class="danger" onclick="doRevoke('${escapeHtml(t.id)}')">撤销</button>` : ""}</td>`;
    tb.appendChild(tr);
  }
}

async function doCreateToken() {
  const name = document.getElementById("tokenName").value.trim();
  if (!name) {
    show(document.getElementById("tokenMsg"), "请填写设备名称");
    return;
  }
  const res = await api("/api/tokens", { method: "POST", headers: hdr(), body: JSON.stringify({ name }) });
  const data = await res.json();
  if (!res.ok) { show(document.getElementById("tokenMsg"), data.error || "生成失败"); return; }
  const box = document.getElementById("newTokenBox");
  box.classList.remove("hidden");
  document.getElementById("newToken").value = data.token;
  show(document.getElementById("tokenMsg"), "Token 已生成，仅显示一次", true);
  document.getElementById("tokenName").value = "";
  loadTokens();
}

async function doRevoke(id) {
  await api("/api/tokens/" + encodeURIComponent(id), { method: "DELETE", headers: hdr() });
  loadTokens();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const APP_TOKEN_KEY = "ocb_app_token";
const TASK_STATUS = {
  queued: "排队中", running: "执行中", succeeded: "已完成",
  failed: "失败", retrying: "重试中", canceled: "已取消",
};

function appTokenFromInput() {
  const inp = document.getElementById("appToken");
  if (inp && inp.value) {
    const v = inp.value.trim();
    localStorage.setItem(APP_TOKEN_KEY, v);
    return v;
  }
  return localStorage.getItem(APP_TOKEN_KEY) || "";
}

function appHeaders() {
  const t = appTokenFromInput();
  const h = {};
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}

async function loadTasks() {
  const t = appTokenFromInput();
  if (!t) { show(document.getElementById("taskMsg"), "请先填写 APP Token"); return; }
  const res = await fetch("/api/tasks", { headers: appHeaders() });
  const data = await res.json();
  if (!res.ok) { show(document.getElementById("taskMsg"), data.error || "加载任务失败"); return; }
  const list = data.tasks || [];
  show(document.getElementById("taskMsg"), `共 ${list.length} 条任务`, true);
  const tb = document.querySelector("#taskTable tbody");
  tb.innerHTML = "";
  for (const task of list) {
    const tr = document.createElement("tr");
    const status = task.status || "queued";
    const detail = (task.error || task.result || "").trim();
    tr.innerHTML = `
      <td class="mono">${escapeHtml(task.id)}</td>
      <td class="clip" title="${escapeHtml(task.directory || "")}">${escapeHtml(task.directory) || "-"}</td>
      <td class="clip" title="${escapeHtml(task.prompt)}">${escapeHtml(task.prompt)}</td>
      <td><span class="badge ${escapeHtml(status)}">${escapeHtml(TASK_STATUS[status] || status)}</span></td>
      <td class="clip" title="${escapeHtml(task.progress || "")}">${escapeHtml(task.progress) || "-"}</td>
      <td class="clip" title="${escapeHtml(detail)}">${escapeHtml(detail) || "-"}</td>
      <td>${new Date(task.createdAt).toLocaleString()}</td>`;
    tb.appendChild(tr);
  }
}

async function loadProjects() {
  const t = appTokenFromInput();
  if (!t) { show(document.getElementById("projectMsg"), "请先在任务列表处填写 APP Token"); return; }
  const res = await fetch("/api/projects", { headers: appHeaders() });
  const data = await res.json();
  if (!res.ok) { show(document.getElementById("projectMsg"), data.error || "加载项目失败"); return; }
  const list = data.projects || [];
  show(document.getElementById("projectMsg"), `共 ${list.length} 个会话`, true);
  const tb = document.querySelector("#projectTable tbody");
  tb.innerHTML = "";
  for (const p of list) {
    const tr = document.createElement("tr");
    const cls = p.busy ? "busy" : "idle";
    const label = p.busy ? "忙碌" : "空闲";
    tr.innerHTML = `
      <td class="mono">${escapeHtml(p.id)}</td>
      <td><span class="badge ${cls}">${label}</span></td>`;
    tb.appendChild(tr);
  }
}

loadAdmin();
</script>
</body>
</html>
