services:
  opencode-backend:
    build:
      context: .
    container_name: opencode-backend
    ports:
      - "8080:8080"
    volumes:
      - opencode-data:/data
    environment:
      OCB_LISTEN: ":8080"
      OCB_SQLITE_PATH: "/data/opencode-backend.db"
    restart: unless-stopped

volumes:
  opencode-data:

  # ---- PostgreSQL 方案（可选）----
